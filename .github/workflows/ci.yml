name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting and module metadata
        run: |
          gofmt -w $(git ls-files '*.go')
          go mod tidy
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: WAF load and latency regression (required, no race detector)
        run: go test -tags=perf -count=30 -v ./edge/internal/waf -run '^TestWAFParallel50GOMAXPROCSMatrix$'

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: docker compose -f deploy/docker-compose.yml pull
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  test-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      nats:
        image: nats:2.10.26-alpine
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration -race -count=1 -v ./edge/internal/ratelimit ./edge/internal/telemetry
        env:
          REDIS_ADDR: 127.0.0.1:6379
          NATS_ADDR: 127.0.0.1:4222
