name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting and module metadata
        run: |
          gofmt -w $(git ls-files '*.go')
          go mod tidy
          make check-cp-sql
          make gen
          git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: WAF load and latency regression (required, no race detector)
        run: go test -tags=perf -count=30 -v ./edge/internal/waf -run '^(TestWAFParallel50GOMAXPROCSMatrix|TestWAFCleanFailClosedAtOnePWithCPUBackground)$'

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: docker compose -f deploy/docker-compose.yml pull
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: waf
          POSTGRES_PASSWORD: waf-test-password
          POSTGRES_DB: waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waf -d waf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      nats:
        image: nats:2.10.26-alpine
        ports:
          - 4222:4222
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration -race -count=1 -v ./edge/internal/ratelimit ./edge/internal/telemetry
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          NATS_ADDR: 127.0.0.1:4222
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages

  cp-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: waf
          POSTGRES_PASSWORD: waf-test-password
          POSTGRES_DB: waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waf -d waf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: PostgreSQL 18 auth and RLS integration (required, 20 runs)
        run: go test -tags=integration -race -count=20 -v ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages
          CP_INTEGRATION_REQUIRED: "1"
