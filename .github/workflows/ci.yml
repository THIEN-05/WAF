name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check generated sources, formatting, and module metadata
        run: make check-generated
      - name: Check control-plane SQL safety
        run: make check-cp-sql
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: WAF load and latency regression (required, no race detector)
        run: |
          export WAF_PERF_NPROC="$(nproc)"
          go test -tags=perf -count=30 -v ./edge/internal/waf -run '^(TestWAFParallel50GOMAXPROCSMatrix|TestWAFCleanFailClosedAtOnePWithCPUBackground)$'
        env:
          WAF_PERF_RUNNER: ${{ runner.name }}
          WAF_PERF_RESULTS: edge/internal/waf/perf-results.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: waf-perf-results
          path: edge/internal/waf/perf-results.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: docker compose -f deploy/docker-compose.yml pull
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: waf
          POSTGRES_PASSWORD: waf-test-password
          POSTGRES_DB: waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waf -d waf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      nats:
        image: nats:2.10.26-alpine
        ports:
          - 4222:4222
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags=integration -race -count=1 -v ./edge/internal/ratelimit ./edge/internal/telemetry
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          NATS_ADDR: 127.0.0.1:4222
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages

  analytics-integration:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3.3.42
        env:
          CLICKHOUSE_DB: waf
          CLICKHOUSE_USER: waf
          CLICKHOUSE_PASSWORD: waf-test-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user waf --password waf-test-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: ClickHouse analytics integration
        run: go test -tags=integration -run '^TestClickHouseBatchRetentionAndTenantPredicatesIntegration$' -bench '^BenchmarkClickHouseWriteBatchIntegration$' -benchtime=5x -count=1 -v ./controlplane/internal/analytics
        env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_DATABASE: waf
          CLICKHOUSE_USER: waf
          CLICKHOUSE_PASSWORD: waf-test-password
          CLICKHOUSE_INTEGRATION_REQUIRED: "1"

  cp-integration:
    runs-on: ubuntu-latest
    env:
      NATS_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: waf
          POSTGRES_PASSWORD: waf-test-password
          POSTGRES_DB: waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waf -d waf_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      nats:
        image: nats:2.10.26-alpine
        ports:
          - 4222:4222
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Report PostgreSQL role and version
        run: go test -tags=integration -run '^TestIntegrationDatabaseIdentity$' -count=1 -v ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          CP_INTEGRATION_REQUIRED: "1"
      - name: PostgreSQL 18 auth and RLS integration (required, first 20 runs)
        run: go test -tags=integration -race -count=20 -v ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages
          CP_INTEGRATION_REQUIRED: "1"
      - name: PostgreSQL 18 auth and RLS integration (required, second 20 runs on same DB)
        run: go test -tags=integration -race -count=20 -v ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages
          CP_INTEGRATION_REQUIRED: "1"
      - name: Global hostname conflict race (required, 100 runs)
        run: go test -tags=integration -race -run '^TestSiteQuotaHostnameOwnershipAndStateIntegration$' -count=100 ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          CP_INTEGRATION_REQUIRED: "1"
      - name: Verify integration subtests run independently
        run: |
          go test -tags=integration -race -run '^TestSiteQuotaHostnameOwnershipAndStateIntegration/free_site_quota_serializes_concurrent_creates$' -count=1 ./controlplane/internal/integration
          go test -tags=integration -race -run '^TestSiteQuotaHostnameOwnershipAndStateIntegration/same_hostname_race_and_non_disclosing_conflict$' -count=1 ./controlplane/internal/integration
          go test -tags=integration -race -run '^TestSiteQuotaHostnameOwnershipAndStateIntegration/site_status_machine_rejects_invalid_transitions$' -count=1 ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          MAILHOG_ADDR: 127.0.0.1:1025
          MAILHOG_API_URL: http://127.0.0.1:8025/api/v2/messages
          CP_INTEGRATION_REQUIRED: "1"
      - name: Assert integration fixture residue is zero
        run: go test -tags=integration -run '^TestZZIntegrationFixtureResidueBudget$' -count=1 -v ./controlplane/internal/integration
        env:
          DATABASE_URL: postgres://waf:waf-test-password@127.0.0.1:5432/waf_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_PASSWORD: ""
          CP_INTEGRATION_REQUIRED: "1"
