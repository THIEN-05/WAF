version: "2"
sql:
  - engine: postgresql
    schema: controlplane/migrations
    queries: controlplane/db/queries
    gen:
      go:
        package: dbsqlc
        out: controlplane/internal/dbsqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
