- id: waf-sqli-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:union\s+(?:all\s+)?select|(?:''|%27)\s*(?:or|and)\s+\d+\s*=\s*\d+|sleep\s*\(|benchmark\s*\()'
  severity: critical
  paranoia: 1
  tags: [owasp-a03, sqli]
  prefilter: [union, select, or, and, sleep, benchmark]

- id: waf-sqli-002
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:information_schema|load_file\s*\(|into\s+outfile|extractvalue\s*\(|updatexml\s*\()'
  severity: error
  paranoia: 1
  tags: [owasp-a03, sqli]
  prefilter: [information_schema, load_file, outfile, extractvalue, updatexml]

- id: waf-xss-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, html_entity_decode, lowercase, remove_nul]
  pattern: '(?:<\s*script\b|on(?:error|load)\s*=|javascript\s*:|data\s*:\s*text/html|svg\s+onload)'
  severity: error
  paranoia: 1
  tags: [owasp-a03, xss]
  prefilter: [script, onerror, onload, javascript, data, svg]

- id: waf-xss-002
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, html_entity_decode, lowercase]
  pattern: '(?:<\s*(?:iframe|object|embed)\b|srcdoc\s*=|expression\s*\(|\bdocument\s*\.\s*cookie)'
  severity: warning
  paranoia: 1
  tags: [owasp-a03, xss]
  prefilter: [iframe, object, embed, srcdoc, expression, document]

- id: waf-traversal-001
  phase: request
  targets: [path, args]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:\.\./|/etc/passwd|boot\.ini|php://|file://|/proc/self)'
  severity: critical
  paranoia: 1
  tags: [owasp-a01, traversal, lfi]
  prefilter: ['..', '../', '%2e%2e', '/etc/passwd', boot.ini, 'php://', 'file://', '/proc/self']

- id: waf-traversal-002
  phase: request
  targets: [args, path]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:/windows/system32|c:.*windows.*system32|/etc/shadow|/var/log/|\.\.%2f|\.\.)'
  severity: error
  paranoia: 1
  tags: [owasp-a01, traversal, lfi]
  prefilter: ['..', system32, shadow, '/var/log', '%2f']

- id: waf-rfi-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:(?:https?|ftp)://[^[:space:]]+\.(?:php|phtml|jsp)(?:[?&]|$)|(?:php|data)://)'
  severity: critical
  paranoia: 1
  tags: [owasp-a10, rfi]
  prefilter: [http, ftp://, php://, data://]

- id: waf-rce-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:;\s*(?:cat|id|uname|whoami|curl|wget|nc|bash|sh)\b|\$\([^)]{1,80}\)|`[^`]{1,80}`|\|\s*(?:sh|bash)\b)'
  severity: critical
  paranoia: 1
  tags: [owasp-a03, rce]
  prefilter: [';cat', ';id', ';whoami', ';curl', ';wget', ';nc', ';uname', '$(', '`', '|sh', '|bash']

- id: waf-rce-002
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:\b(?:powershell|cmd\.exe)\b.{0,40}(?:/c| -enc)|\bbash\b.{0,30}\s-c\b|\b(?:runtime\.getruntime|processbuilder)\b)'
  severity: error
  paranoia: 1
  tags: [owasp-a03, rce]
  prefilter: [powershell, cmd.exe, bash, runtime.getruntime, processbuilder]

- id: waf-ssrf-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:(?:https?|ftp)://(?:169\.254\.169\.254|127\.0\.0\.1|localhost)(?:[:/]|$)|(?:169\.254\.169\.254|127\.0\.0\.1|localhost))'
  severity: critical
  paranoia: 1
  tags: [owasp-a10, ssrf]
  prefilter: [169.254.169.254, 127.0.0.1, localhost]

- id: waf-ssrf-002
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:(?:https?|ftp)://(?:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})(?:[:/]|$))'
  severity: error
  paranoia: 1
  tags: [owasp-a10, ssrf]
  prefilter: [http://10., https://10., http://192.168., https://192.168., http://172., https://172., ftp://127.]

- id: waf-xxe-001
  phase: request
  targets: [body]
  transforms: [url_decode, lowercase, html_entity_decode]
  pattern: '<!doctype[^>]{0,160}\[\s*<!entity'
  severity: critical
  paranoia: 1
  tags: [owasp-a05, xxe]
  prefilter: [<!doctype, <!entity]

- id: waf-ssti-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:\{\{[^}]{0,80}\}\}|\$\{[^}]{0,80}\}|<%=?[^%]{1,80}%>)'
  severity: error
  paranoia: 1
  tags: [owasp-a03, ssti]
  prefilter: ['{{', '${', '<%']

- id: waf-deserialization-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: '(?:aced0005|\$type\s*"\s*:\s*"[^" ]{1,40}|java\.io\.objectinputstream|ro0ab[A-Za-z0-9+/]{3})'
  severity: critical
  paranoia: 1
  tags: [owasp-a08, deserialization]
  prefilter: [aced0005, '$type', objectinputstream, rO0AB]

- id: waf-protocol-001
  phase: request
  targets: [protocol]
  transforms: [lowercase]
  pattern: '^(?:missing_host|unusual_method=)'
  severity: warning
  paranoia: 1
  tags: [owasp-a04, protocol-anomaly, protocol]
  prefilter: [missing_host, unusual_method]

- id: waf-protocol-002
  phase: request
  targets: [protocol]
  transforms: [lowercase]
  pattern: '^(?:content_length_transfer_encoding|duplicate_content_length)$'
  severity: critical
  paranoia: 1
  tags: [owasp-a04, request-smuggling, protocol]
  prefilter: [content_length_transfer_encoding, duplicate_content_length]

- id: waf-scanner-ua-001
  phase: request
  targets: [headers]
  transforms: [lowercase]
  pattern: '(?:sqlmap|nikto|nmap|masscan|acunetix|nessus|zgrab|gobuster|dirbuster)'
  severity: warning
  paranoia: 1
  tags: [owasp-a05, scanner]
  prefilter: [sqlmap, nikto, nmap, masscan, acunetix, nessus, zgrab, gobuster, dirbuster]

- id: waf-sensitive-files-001
  phase: request
  targets: [path]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:/\.env(?:\.|/|$)|/\.git(?:/|$)|/\.aws/(?:credentials|config)|/wp-config\.php(?:\.bak)?$|/\.ssh/|/id_rsa$)'
  severity: error
  paranoia: 1
  tags: [owasp-a01, sensitive-file, sensitive]
  prefilter: [.env, .git, .aws, wp-config, .ssh, id_rsa]

- id: waf-virtual-patch-001
  phase: request
  targets: [args, body]
  transforms: [url_decode, lowercase]
  pattern: 'cve-2099-0000-replace-with-reviewed-indicator'
  severity: error
  paranoia: 4
  tags: [owasp-a06, virtual-patching, template, virtual_patch]
  prefilter: [cve-2099-0000-replace-with-reviewed-indicator]
- id: waf-sqli-p4c-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:(?:''|%27|\")\s*(?:or|and)\s+(?:[''"]?\w+[''"]?\s*(?:=|like|>|<)\s*[''"]?\w+|\d+\s*(?:=|>|<)\s*\d+)|;\s*(?:select|with)\b.{0,100}\b(?:pg_sleep|sleep|benchmark)\s*\()'
  severity: critical
  paranoia: 1
  tags: [owasp-a03, sqli]
  prefilter: [or, and, select, pg_sleep, benchmark]

- id: waf-xss-p4c-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, html_entity_decode, lowercase, remove_nul]
  pattern: '(?:<\s*(?:math|details|animate|foreignobject)\b[^>]{0,160}\bon[a-z]{3,}\s*=|\bon(?:begin|toggle|focus|mouseover|animationstart)\s*=)'
  severity: error
  paranoia: 1
  tags: [owasp-a03, xss]
  prefilter: [onbegin, ontoggle, onfocus, onmouseover, onanimationstart, foreignobject]

- id: waf-rce-p4c-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, compress_whitespace]
  pattern: '(?:&&?\s*(?:python[0-9.]*|perl|ruby|php)\s+-c\b|(?:^|\s)/(?:usr/)?bin/(?:id|whoami|uname)\b|\$\{ifs\}\s*(?:sh|bash)|\|\s*\$\{ifs\}\s*(?:sh|bash))'
  severity: critical
  paranoia: 1
  tags: [owasp-a03, rce]
  prefilter: [python, /bin/id, /usr/bin, '${ifs}', perl, ruby]

- id: waf-ssrf-p4c-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:(?:https?|ftp)://\[(?:::1|fe[89ab][0-9a-f]:|f[cd][0-9a-f]{2}:)|(?:https?|ftp)://(?:0177\.0\.0\.1|2130706433|0x7f000001)(?:[:/]|$))'
  severity: critical
  paranoia: 1
  tags: [owasp-a10, ssrf]
  prefilter: ['::1', fe80, 0177, 2130706433, 0x7f000001]

- id: waf-sensitive-files-p4c-001
  phase: request
  targets: [path]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:/\.hg/|/\.docker/|/\.npmrc$|/server-status$|/actuator/(?:env|heapdump)|/debug/vars$|/config\.php\.(?:save|old|orig)$|/backup/[^/]+\.(?:sql|tar|zip)|\.tfstate(?:\.backup)?$|/id_ed25519$)'
  severity: error
  paranoia: 1
  tags: [owasp-a01, sensitive-file, sensitive]
  prefilter: [.hg, .docker, .npmrc, server-status, actuator, debug/vars, backup, tfstate, id_ed25519]

- id: waf-scanner-ua-p4c-001
  phase: request
  targets: [headers]
  transforms: [lowercase]
  pattern: '(?:wpscan|arachni|whatweb|feroxbuster|ffuf|httpx/|nuclei/|openvas)'
  severity: warning
  paranoia: 1
  tags: [owasp-a05, scanner]
  prefilter: [wpscan, arachni, whatweb, feroxbuster, ffuf, nuclei, openvas]

- id: waf-sqli-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:\b(?:or|and)\b\s+\d+\s*(?:=|>|<)\s*\d+|''\s*(?:or|and)\s*''[^'']{1,24}''\s*=\s*''[^'']{1,24}''|\b(?:or|and)\b\s+[^\s]{1,24}\s*(?:like|regexp|rlike)\s+[^\s]{1,24}|\bhaving\s+\d+\s*=\s*\d+|\b(?:waitfor\s+delay|pg_sleep|dbms_lock\.sleep)\s*\()'
  severity: error
  paranoia: 2
  tags: [owasp-a03, sqli, sqli-boolean]
  prefilter: [or, and, having, regexp, rlike, waitfor, pg_sleep, dbms_lock]

- id: waf-sqli-p3-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:\bunion\s+(?:distinct\s+)?select\b.{0,100}\b(?:from|information_schema)\b|\b(?:extractvalue|updatexml)\s*\()'
  severity: critical
  paranoia: 3
  tags: [owasp-a03, sqli, sqli-union]
  prefilter: [union, select, extractvalue, updatexml]

- id: waf-sqli-p4-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, remove_sql_comments, compress_whitespace]
  pattern: '(?:\b(?:benchmark|sleep|pg_sleep)\s*\([^)]{0,80}\)|\binto\s+(?:dumpfile|outfile)\b|\bload_file\s*\()'
  severity: critical
  paranoia: 4
  tags: [owasp-a03, sqli, sqli-exfiltration]
  prefilter: [benchmark, sleep, pg_sleep, dumpfile, outfile, load_file]

- id: waf-rce-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, compress_whitespace]
  pattern: '(?:;\s*(?:printf|printenv|env)\b.{0,80}(?:\$|path|home|http)|(?:%0a|\n)\s*(?:id|whoami|uname)\b)'
  severity: error
  paranoia: 2
  tags: [owasp-a03, rce, shell-enumeration]
  prefilter: [printf, printenv, env, '%0a', id, whoami, uname]

- id: waf-rce-p3-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, compress_whitespace]
  pattern: '(?:\b(?:curl|wget)\b.{0,100}\|\s*(?:sh|bash)\b|\b(?:nc|ncat|netcat)\b.{0,80}(?:-e|--exec)\s*/bin/)'
  severity: critical
  paranoia: 3
  tags: [owasp-a03, rce, shell-pipeline]
  prefilter: [curl, wget, nc, ncat, netcat]

- id: waf-rce-p4-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase, compress_whitespace]
  pattern: '(?:\b(?:base64\s+-d|chmod\s+\+x|mkfifo)\b.{0,80}(?:/bin/|\$\(|;)|\$\{ifs\}.{0,20}(?:curl|wget|bash|sh))'
  severity: critical
  paranoia: 4
  tags: [owasp-a03, rce, shell-obfuscation]
  prefilter: [base64, chmod, mkfifo, '${ifs}']

- id: waf-traversal-p2-001
  phase: request
  targets: [path, args, body]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:\.\.%2f|\.\.%5c|%2e%2e%2f|%2e%2e%5c|\.\.;[/\\])'
  severity: error
  paranoia: 2
  tags: [owasp-a01, traversal, encoded-traversal]
  prefilter: ['..%2f', '..%5c', '%2e%2e']

- id: waf-traversal-p3-001
  phase: request
  targets: [path, args]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:%u(?:002e|2215)|%c0%ae|%c1%9c|%252e%252e|\.\.\\\.\.)'
  severity: critical
  paranoia: 3
  tags: [owasp-a01, traversal, unicode-traversal]
  prefilter: ['%u', '%c0', '%c1', '%252e']

- id: waf-traversal-p4-001
  phase: request
  targets: [path, args]
  transforms: [url_decode, path_normalize, lowercase]
  pattern: '(?:\\\.\\.|\.\.%00|\.\.%c0%af|(?:/|\\)(?:etc/(?:shadow|passwd)|proc/self/environ))'
  severity: critical
  paranoia: 4
  tags: [owasp-a01, traversal, lfi]
  prefilter: ['%00', '%c0', shadow, passwd, environ]

- id: waf-deser-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:o:\s*[0-9]{1,3}:"[^" ]{1,60}"|!!(?:python|java)/object|java\.util\.priorityqueue|\$type\\?"?\s*:\\?"[^" ]{1,60}")'
  severity: error
  paranoia: 2
  tags: [owasp-a08, deserialization, serialized-object]
  prefilter: ['o:', '!!python', '!!java', priorityqueue, '$type']

- id: waf-xss-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, html_entity_decode, lowercase, remove_nul]
  pattern: '\bon(?:pageshow|pagehide|animationstart|animationend|pointerenter|pointerleave)\s*='
  severity: error
  paranoia: 2
  tags: [owasp-a03, xss, event-handler]
  prefilter: [onpageshow, onpagehide, onanimation, onpointer]

- id: waf-rfi-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:(?:https?|ftp)://[^\s]{1,160}\.(?:php|phtml|jsp)(?:[?&]|$)|(?:php|data)://)'
  severity: critical
  paranoia: 2
  tags: [owasp-a10, rfi, remote-include]
  prefilter: [http, ftp, php://, data://]

- id: waf-ssrf-p2-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:https?://(?:10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3})(?:[:/]|$))'
  severity: critical
  paranoia: 2
  tags: [owasp-a10, ssrf, private-network]
  prefilter: [http://10., http://192.168., http://172., http://169.254.]

- id: waf-deser-p3-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:__reduce__|__globals__|invokertransformer|commons\.collections\.functors)'
  severity: critical
  paranoia: 3
  tags: [owasp-a08, deserialization, gadget-chain]
  prefilter: [__reduce__, __globals__, invokertransformer, commons.collections]

- id: waf-deser-p4-001
  phase: request
  targets: [args, body, cookies]
  transforms: [url_decode, lowercase]
  pattern: '(?:java\.security\.signedobject|org\.apache\.commons\.collections|system\.management\.automation\.psobject)'
  severity: critical
  paranoia: 4
  tags: [owasp-a08, deserialization, gadget-chain]
  prefilter: [signedobject, org.apache.commons, psobject]
